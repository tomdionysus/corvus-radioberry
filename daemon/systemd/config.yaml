#
# radioberryd options, read with --config (radioberry.service passes this
# file). Each key is a long option with _ for - and the same value
# (radioberryd --help); an option given on the command line overrides it.
# radioberryd reads this at start: restart the service after a change.

# The radioberry.ko device to open.
device: /dev/radioberry

# IPv4 address to listen on; 0.0.0.0 is every interface.
address: 0.0.0.0

# UDP and TCP port for Protocol 1, and Protocol 2's base port (Protocol 2 also
# uses port + 1 to port + 5 and port + 11 to port + 16).
port: 1024

# MAC address reported by discovery; left out, it is the network interface's.
# mac: 02:00:00:00:00:01

# Milliseconds of silence from a client before it loses the radio.
client_timeout_ms: 3000

# The radio's frequency error in ppm, positive if it tunes high; every RX and
# TX frequency is corrected. 22.9 is typical of these boards; measure your own
# (docs/calibration.md).
frequency_ppm: 22.9

# I/Q order: hl2 for Hermes-Lite 2 software such as piHPSDR, standard for
# plain complex-baseband clients.
iq_convention: hl2

# Protocol 2 LNA gain in dB, -12 to 48, less the client's step attenuation.
p2_rx_gain: 14

# Protocols to serve: 1, 2 or 1,2. A protocol left out is not answered.
protocols: 1,2

# Run the stream threads at SCHED_FIFO and lock memory (needs CAP_SYS_NICE and CAP_IPC_LOCK).
realtime: false

# Log detail: trace, debug, info, warn or error.
log_level: info

# Let the client that owns the radio transmit while it holds MOX. No PA interlock is claimed.
allow_tx: false

# Pass on the client's PA enable while transmitting; connect a rated antenna or dummy load first.
allow_pa: false

# Highest drive level sent to the radio, 0 to 255, whatever the client asks for.
drive_ceiling: 150

# Longest single transmission in seconds before MOX is dropped.
tx_watchdog_s: 120
